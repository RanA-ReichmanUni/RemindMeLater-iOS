name: remind_me_later
description: A cross-platform app to dump and forget your unwanted but necessary tasks.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^2.0.1
  flutter_ringtone_player: ^3.2.0
  url_launcher: ^6.2.5
  firebase_core: ^4.9.0
  firebase_remote_config: ^6.5.1
  package_info_plus: ^10.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "ios/Assets/icon/app_icon.png"

flutter:
  uses-material-design: true
